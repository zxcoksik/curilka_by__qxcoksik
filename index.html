<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap head">
    <a class="logo" href="./">CATALOG</a>
    <button id="uploadButton" class="button">＋ Добавить фото</button>
    <input id="fileInput" type="file" accept="image/webp,image/jpeg,image/png" hidden>
  </div>
  <div class="wrap">
    <input id="search" class="search" type="search" placeholder="Поиск товара или артикула…">
    <div id="categories" class="categories"></div>
  </div>
</header>

<main class="wrap">
  <div class="top">
    <div>
      <h1 id="heading">Все товары</h1>
      <div id="count" class="muted"></div>
    </div>
    <button id="reset" class="button light">Сбросить</button>
  </div>
  <div id="grid" class="grid"></div>
</main>

<div id="viewer" class="viewer" hidden>
  <button id="closeViewer" class="close">×</button>
  <img id="viewerImg" alt="">
  <div id="viewerText"></div>
</div>

<div id="help" class="help">
  <b>Как добавить фото:</b> назови файл по артикулу, например <code>00046.webp</code>,
  положи его в <code>assets/images/</code> и загрузи папку проекта на GitHub.
  Кнопка «Добавить фото» нужна для быстрого просмотра своего фото на этом устройстве.
</div>

<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
